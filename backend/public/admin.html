<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMF Backend Media Admin</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #181c24;
        --text: #f3f5f8;
        --muted: #a8b0bf;
        --accent: #7c5cff;
        --ok: #22c55e;
      }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: linear-gradient(160deg, #0b0d11, #141924); color: var(--text); }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { margin: 0 0 8px; font-size: 2rem; }
      p { color: var(--muted); }
      .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
      .card { background: rgba(24, 28, 36, 0.94); border: 1px solid #2b3342; border-radius: 16px; padding: 16px; }
      textarea { width: 100%; min-height: 560px; background: #0e1219; color: #d8e2ff; border: 1px solid #2c3750; border-radius: 12px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.5; }
      button { background: var(--accent); color: white; border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
      button.secondary { background: #303748; }
      .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
      .status { font-size: 13px; color: var(--muted); }
      .status.ok { color: var(--ok); }
      .usage { max-height: 640px; overflow: auto; }
      .item { border: 1px solid #303a4c; border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #111722; }
      .key { color: #95b8ff; font-family: ui-monospace, monospace; font-size: 13px; }
      ul { margin: 8px 0 0 18px; padding: 0; color: #c6cfdd; }
      @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Backend Media Admin</h1>
      <p>Edit all photos/videos from backend. Save once, changes reflect wherever keys are used.</p>

      <div class="grid">
        <section class="card">
          <div class="row">
            <button id="reload">Reload</button>
            <button id="save">Save media.json</button>
            <button class="secondary" id="format">Format JSON</button>
            <span id="status" class="status">Loading…</span>
          </div>
          <textarea id="editor" spellcheck="false"></textarea>
        </section>

        <aside class="card usage">
          <h3>Where each key changes UI</h3>
          <div id="usage-list"></div>
        </aside>
      </div>
    </div>

    <script>
      const editor = document.getElementById('editor');
      const statusEl = document.getElementById('status');
      const usageList = document.getElementById('usage-list');

      const setStatus = (msg, ok = false) => {
        statusEl.textContent = msg;
        statusEl.className = ok ? 'status ok' : 'status';
      };

      const loadMedia = async () => {
        try {
          const response = await fetch('/api/media');
          const data = await response.json();
          editor.value = JSON.stringify(data.media ?? {}, null, 2);
          setStatus('Media loaded.', true);
        } catch (error) {
          setStatus('Failed loading media: ' + error.message);
        }
      };

      const loadUsage = async () => {
        try {
          const response = await fetch('/api/media/usage');
          const usage = await response.json();
          usageList.innerHTML = usage.map((entry) => `
            <div class="item">
              <div class="key">${entry.key}</div>
              <p>${entry.description}</p>
              <ul>${entry.usedIn.map((path) => `<li>${path}</li>`).join('')}</ul>
            </div>
          `).join('');
        } catch (error) {
          usageList.innerHTML = `<p>Failed loading usage map: ${error.message}</p>`;
        }
      };

      const saveMedia = async () => {
        try {
          const parsed = JSON.parse(editor.value);
          const response = await fetch('/api/media', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ media: parsed }),
          });

          if (!response.ok) {
            const errorPayload = await response.json();
            throw new Error(errorPayload.error || 'Save failed');
          }

          setStatus('Saved successfully to backend/data/media.json', true);
        } catch (error) {
          setStatus('Save failed: ' + error.message);
        }
      };

      document.getElementById('reload').addEventListener('click', loadMedia);
      document.getElementById('save').addEventListener('click', saveMedia);
      document.getElementById('format').addEventListener('click', () => {
        try {
          const parsed = JSON.parse(editor.value);
          editor.value = JSON.stringify(parsed, null, 2);
          setStatus('JSON formatted.', true);
        } catch (error) {
          setStatus('Invalid JSON: ' + error.message);
        }
      });

      loadMedia();
      loadUsage();
    </script>
  </body>
</html>
